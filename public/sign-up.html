<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="assets/style/darkstyle.css" rel="stylesheet">
    <link rel='icon' href="assets/icon/app-icon-square.svg" type="image/x-icon">
    <title>Kryptik Passcodes - Sign Up</title>
  </head>

  <body>
    <script src="assets/logic/nav.js"></script>
      <div id="signup-cont">

      <div id="input-cont">
        <div id="input-title">
          <h1 id="create">Create Account</h1>
        </div>

        <form id="signup-form" novalidate>
          <div id="input-groups">
            <input type="text" id="user" placeholder="Username or Email" autocomplete="username">
            <input type="password" id="master-pass" placeholder="Enter password" autocomplete="new-password">
            <input type="password" id="pass-confirm" placeholder="Confirm password" autocomplete="new-password">
          
            <div id="master-pass-check">
                <div class="meter-fill" id="strength-meter"></div>  
            </div>
          </div>

          <div id="main-btns">
            <button type="submit" class="inputBtn" id="signup-confirm">Create a Kryptik Account</button>
          </div>
        </form>

        <p class="switch-signin">Already have an account? <a href="log-in.html">Sign-in</a></p>        
      </div>
    </div>
    
    <script src="assets/logic/checker.js"></script>
    <script src="assets/logic/crypto.js"></script>
    <script src="assets/logic/auth.js"></script>
    <footer>
     <h6 id='signUpFoot'>Kryptik Passcodes&copy All rights reserved.</h6> 
    </footer>
  </body>
</html>
